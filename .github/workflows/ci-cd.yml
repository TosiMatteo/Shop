name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/shop

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 – Test Angular
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: "Angular – Unit Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Unit tests (ChromeHeadless)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: frontend
        env:
          CHROME_BIN: google-chrome

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 – Test Rails (Minitest)
  # ──────────────────────────────────────────────────────────────────────────
  test-backend:
    name: "Rails – Minitest"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rails"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby 3.4.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
          working-directory: backend

      - name: Prepara database di test
        run: bundle exec rails db:test:prepare
        working-directory: backend
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_USER: rails
          DATABASE_PASSWORD: password
          DATABASE_NAME: rails_test

      - name: Run Minitest
        run: bundle exec rails test
        working-directory: backend
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_USER: rails
          DATABASE_PASSWORD: password
          DATABASE_NAME: rails_test

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 – Qualità e sicurezza backend
  # ──────────────────────────────────────────────────────────────────────────
  quality-backend:
    name: "Rails – RuboCop, Brakeman, Bundler Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby 3.4.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true
          working-directory: backend

      - name: RuboCop
        run: bundle exec rubocop --format github
        working-directory: backend

      - name: Brakeman
        run: bundle exec brakeman --no-pager --exit-on-warn
        working-directory: backend

      - name: Bundler Audit
        run: bundle exec bundler-audit check --update
        working-directory: backend

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 – E2E con Playwright
  # Dipende dai tre job precedenti: inutile testare E2E se i test unitari
  # o la qualità falliscono.
  #
  # Strategia: avviamo db + backend + frontend via Docker Compose (senza
  # il profilo "e2e"), poi eseguiamo Playwright DIRETTAMENTE sull'agente.
  # Questo evita problemi di networking tra il container playwright e il
  # runner, e ci permette di usare localhost:4200 come BASE_URL.
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: "Playwright E2E"
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, quality-backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Avvia db, backend e frontend
        run: docker compose up -d db backend frontend

      - name: Attendi che il frontend sia raggiungibile
        run: |
          echo "Waiting for frontend on port 4200..."
          timeout 150 bash -c \
            'until curl -sf http://localhost:4200 > /dev/null; do sleep 4; done'
          echo "Frontend is ready!"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
        env:
          BASE_URL: http://localhost:4200

      - name: Upload report (solo su fallimento)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5 – Build & Push su Docker Hub
  # Eseguito SOLO su push a main e SOLO dopo che tutti gli E2E passano.
  # Frontend → usa ./frontend/Dockerfile
  # Backend  → usa ./backend/Dockerfile.dev (l'unico Dockerfile presente)
  #
  # LIMITAZIONE: entrambi i Dockerfile sono immagini di sviluppo (ng serve
  # e rails s). Per la produzione andrebbero sostituiti con immagini
  # multi-stage (build Angular + nginx, e rails in production mode).
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: "Metadata – frontend"
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: "Build & Push – frontend"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: "Metadata – backend"
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: "Build & Push – backend"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Il backend NON ha un Dockerfile plain: usa Dockerfile.dev
          dockerfile: ./backend/Dockerfile.dev
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
