services:
  # ─── Database PostgreSQL ───────────────────────────────────────────────────
  db:
    image: postgres:16
    networks:
      - shop_network
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: rails
      POSTGRES_DB: backend_development
    ports:
      - "5432:5432"
    volumes:
      # Volume named per la persistenza dei dati tra i riavvii del container
      - postgres_data:/var/lib/postgresql/data

  # ─── Backend Rails ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    networks:
      - shop_network
    # Rimozione del file PID residuo prima di avviare il server,
    # per evitare errori in caso di riavvio non pulito
    # db:prepare crea e migra il database se non esiste: indispensabile perche'
    # lo stack puo' puntare su un DB diverso (es. backend_e2e) a ogni avvio.
    command: /bin/sh -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bundle exec rails s -b '0.0.0.0'"
    volumes:
      # Montaggio del codice sorgente per il live reload in sviluppo
      - ./backend:/rails
      # Volume named per la cache delle gem, evita di reinstallarle a ogni rebuild
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USER: rails
      DATABASE_PASSWORD: password
      # Default = sviluppo. Il file .env.e2e li sovrascrive con backend_e2e /
      # tmp/storage_e2e, cosi' i test Playwright non toccano i dati di sviluppo.
      DATABASE_NAME: ${DATABASE_NAME:-backend_development}
      STORAGE_ROOT: ${STORAGE_ROOT:-storage}
      # Opt-in: attivato solo da .env.e2e. In sviluppo resta "false",
      # cosi' GET /test/reset non e' nemmeno raggiungibile.
      ENABLE_TEST_HELPERS: ${ENABLE_TEST_HELPERS:-false}

  # ─── Frontend Angular ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - shop_network
    volumes:
      # Montaggio del codice sorgente per il live reload in sviluppo
      - ./frontend:/app
      # Impedisce che node_modules dell'host sovrascriva quello del container
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    command: >
      ng serve --host 0.0.0.0
               --poll 2000
               --proxy-config proxy.conf.json

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /e2e
    networks:
      - shop_network
    volumes:
      - ./e2e:/e2e
    ports:
      - "8080:8080"
    depends_on:
      - frontend
      - backend
    command: >
      sh -c "npm install && npx playwright test"
    profiles:
      - e2e

networks:
  shop_network:
    driver: bridge

# ─── Volumi named ─────────────────────────────────────────────────────────────
volumes:
  # Dati del database PostgreSQL
  postgres_data:
  # Cache delle gem Ruby per velocizzare i rebuild
  bundle_cache:
